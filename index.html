    <!--
      NOTAS PARA INTEGRACIÓN (Cc / Supabase) — leer antes de conectar backend
      ================================================================
      TERCERA VUELTA (2026-08-04): reemplaza por completo el modelo anterior de
      10-12 dimensiones con score de autopercepción. Ya NO existen: group
      'core'/'context', CONTEXT_DISCLAIMER, section_id/question_id viejos
      (strategy, clients, processes, biosecurity, hr, technology, finance,
      marketing, quality, compliance, ai_adoption, doc_clinical) ni el radar
      de 4 ejes. Ver docs supersedidos.

      1) ESTRUCTURA NUEVA: 8 bloques, 26 preguntas. section_id = id de bloque:
         profile, marketing, technology, processes, doc_clinical, ai_adoption,
         revenue_automation, barriers_investment.
      2) QUESTION_IDs por bloque:
         - profile (no puntúa): profile_size (single-choice, 4 opts),
           profile_location (open), profile_role (single-choice, 5 opts)
         - marketing (maturity): mkt1 (single, 4), mkt2 (multi, 6),
           mkt3 (single, 4), mkt4 (single, 3), mkt5 (single, 4)
         - technology (maturity): tech1 (single, 3), tech2 (likert-1-5),
           tech3 (single, 3)
         - processes (maturity): proc1 (single, 4), proc2 (single, 4),
           proc3 (single, 3)
         - doc_clinical (maturity): doc1 (single, 4, ORDEN INVERTIDO —
           ver nota abajo), doc2 (single, 4), doc3 (single, 3)
         - ai_adoption (maturity): ia1 (single, 3), ia2 (multi, 7),
           ia3 (single, 4)
         - revenue_automation (maturity): rev1 (single, 3), rev2 (single, 3),
           rev3 (single, 3)
         - barriers_investment (qualification, NO maturity): inv1 (single, 4),
           inv2 (likert-1-5), inv3 (multi, 4)
      3) TIPOS DE VALOR GUARDADO por pregunta:
         - single-choice → entero: índice de la opción elegida (0-based),
           orden de opciones va de menos a más maduro (doc1 es la excepción
           invertida: índice 0 = "menos de 30 min" = más maduro).
         - multi-choice → array de enteros (índices de opciones marcadas).
         - open → string.
         - likert-1-5 (solo tech2, inv2) → entero 1-5.
      4) NIVEL DE MADUREZ (reemplaza overall_score/section_scores/radar viejo):
         se calcula SOLO con las 20 preguntas maturity=true (bloques marketing,
         technology, processes, doc_clinical, ai_adoption, revenue_automation).
         Fórmula: normalizar cada respuesta a 0-1 (single-choice: índice/(n-1),
         invertido en doc1; multi-choice: seleccionadas/total opciones;
         likert-1-5: (valor-1)/4) y promediar × 100. Tiers: 0-33 Inicial,
         34-66 En Desarrollo, 67-100 Avanzado. Ver computeMaturity() en el código.
         El backend puede recalcular igual si prefiere hacerlo server-side —
         la fórmula es determinística a partir de las 20 respuestas guardadas.
      5) Bloque profile y bloque barriers_investment (inv1/inv2/inv3) se
         guardan igual que el resto pero NO entran al cálculo de madurez —
         se muestran aparte en resultados (QualificationSummary) para
         calificación de venta y personalización del informe.
      ================================================================
    -->

        const { useState, useEffect, useRef, useMemo } = React;

        // ===================== FORMSPREE CONFIG =====================
        const FORMSPREE_ID = "meoydobv";
        const sendToFormspree = (data) => {
            fetch("https://formspree.io/f/" + FORMSPREE_ID, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(data)
            }).then(r => console.log(r.ok ? "Enviado" : "Error de envío"))
              .catch(e => console.log("Error:", e));
        };

        // ===================== SUPABASE CONFIG =====================
        // Proyecto: VetPrompt Pro (reusado — RLS aísla estas 3 tablas de casos_veterinarios).
        // anon/publishable key: segura de exponer client-side, protegida por RLS (solo INSERT).
        const SUPABASE_URL = "https://yyzoszwggxjyjqtjhhjs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_99rwTS9z588BQmStnJwa7A_EbLPtQuG";

        // UUID v4 sin depender de crypto.randomUUID() (requiere contexto seguro;
        // puede fallar si se abre el archivo como file:// en vez de http/https).
        const genUUID = () => {
            const bytes = new Uint8Array(16);
            (window.crypto || window.msCrypto).getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
            return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
        };
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // BLOCKS se define más abajo — este mapa se completa en tiempo de ejecución
        // (la función se llama después de que BLOCKS ya existe en el módulo).
        // Nota: los inserts NO piden .select() a propósito. Pedir la fila de vuelta
        // (Prefer: return=representation) obliga a Postgres a validar la fila insertada
        // también contra una política de SELECT — y no existe ninguna para `anon`
        // (a propósito, para que nadie pueda leer datos de otras clínicas). Sin
        // .select(), el insert usa return=minimal y no choca con RLS. Por eso los IDs
        // se generan acá mismo (genUUID) en vez de esperar a que la DB los devuelva.
        const saveToSupabase = async (clinicInfo, responses, score, tier, status) => {
            try {
                const clinicId = genUUID();
                const { error: clinicErr } = await supabaseClient
                    .from('clinics')
                    .insert({ id: clinicId, name: clinicInfo.clinicName, email: clinicInfo.email || null });
                if (clinicErr) throw clinicErr;

                const sessionId = genUUID();
                const { error: sessionErr } = await supabaseClient
                    .from('survey_sessions')
                    .insert({
                        id: sessionId,
                        clinic_id: clinicId,
                        maturity_score: status === 'completed' ? Math.round(score * 100) / 100 : null,
                        maturity_tier: status === 'completed' ? tier : null,
                        status,
                        completed_at: status === 'completed' ? new Date().toISOString() : null
                    });
                if (sessionErr) throw sessionErr;

                const idToBlock = {};
                BLOCKS.forEach(b => b.questions.forEach(q => { idToBlock[q.id] = { block_id: b.id, question_type: q.type }; }));

                const rows = Object.entries(responses)
                    .filter(([qid]) => idToBlock[qid])
                    .map(([qid, value]) => ({
                        session_id: sessionId,
                        block_id: idToBlock[qid].block_id,
                        question_id: qid,
                        question_type: idToBlock[qid].question_type,
                        value
                    }));

                if (rows.length > 0) {
                    const { error: responsesErr } = await supabaseClient.from('survey_responses').insert(rows);
                    if (responsesErr) throw responsesErr;
                }
                console.log("Supabase: guardado OK (" + rows.length + " respuestas)");
                return clinicId;
            } catch (e) {
                console.log("Supabase error:", e);
                return null;
            }
        };

        // Actualiza el email de una clínica ya guardada (captura tardía en ResultsScreen,
        // evita duplicar clinic/session/responses si el visitante no dio email al inicio).
        const updateClinicEmail = async (clinicId, email) => {
            if (!clinicId) return;
            try {
                const { error } = await supabaseClient.from('clinics').update({ email }).eq('id', clinicId);
                if (error) throw error;
            } catch (e) {
                console.log("Supabase error (update email):", e);
            }
        };

                    { id: 'doc3', type: 'single-choice', text: '¿Qué tan estandarizada es la documentación entre médicos?', options: ['Cada uno tiene su propio estilo', 'Plantilla base, no siempre seguida', 'Altamente estandarizada'] }
                ]
            },
            {
                id: 'ai_adoption', title: 'Adopción de IA', icon: 'link', accent: 'teal', maturity: true,
                description: 'Familiaridad, uso actual y actitud del equipo frente a la IA.',
                questions: [
                    { id: 'ia1', type: 'single-choice', text: '¿Qué tan familiarizado está el equipo con la IA generativa?', options: ['Nulo', 'Uso individual e informal', 'Uso institucional'] },
                    { id: 'ia2', type: 'multi-choice', text: '¿En qué áreas ya usan IA?', options: ['Ninguna', 'Radiología / imagenología', 'Notas SOAP', 'Marketing / contenido', 'Explicación de informes a tutores', 'Chatbots / comunicación', 'Dosis / protocolos'] },
                    { id: 'ia3', type: 'single-choice', text: '¿Cuál es la actitud general del equipo hacia la IA?', options: ['Rechazo o miedo', 'Escépticos', 'Interés con dudas', 'Entusiasmo'] }
                ]
            },
            {
                id: 'revenue_automation', title: 'Automatización de Ingresos', icon: 'chart', accent: 'emerald', maturity: true,
                description: 'Recordatorios, facturación y planes de salud recurrentes.',
                questions: [
                    { id: 'rev1', type: 'single-choice', text: '¿Cómo maneja recordatorios (vacunas, desparasitación)?', options: ['Manual', 'Automático básico (correo/SMS)', 'Inteligente vía WhatsApp con agenda automática'] },
                    { id: 'rev2', type: 'single-choice', text: '¿Audita la facturación no cobrada?', options: ['No revisamos', 'Revisión manual aleatoria', 'Interesa un sistema que detecte ingresos perdidos'] },
                    { id: 'rev3', type: 'single-choice', text: '¿Ofrece planes de salud con cobro recurrente?', options: ['No ofrecemos', 'Sí, con seguimiento manual', 'Sí, automatizado'] }
                ]
            },
            {
                id: 'barriers_investment', title: 'Barreras y Disposición de Inversión', icon: 'scale', accent: 'rose', maturity: false,
                description: 'Su mayor barrera, disposición a invertir y la solución que le resultaría más atractiva.',
                questions: [
                    { id: 'inv1', type: 'single-choice', text: '¿Cuál es la mayor barrera para adoptar más tecnología o IA?', options: ['Presupuesto', 'Tiempo / capacitación', 'Desconfianza (seguridad o legal)', 'Falta de oferta adaptada a veterinaria'] },
                    { id: 'inv2', type: 'likert-1-5', text: '¿Qué tan probable es que invierta en un recurso que le ahorre 1-2 horas al día?', lowLabel: 'Nada probable', highLabel: 'Muy probable' },
                    { id: 'inv3', type: 'multi-choice', text: '¿Qué solución le resultaría más atractiva implementar ya?', options: ['Plantillas zero-code', 'Sistema de notas SOAP automatizado', 'Asistente de WhatsApp', 'Comunidad / capacitación continua'] }
                ]
            }
        ];

        const QUALIFICATION_DISCLAIMER = 'Estas respuestas no afectan su Nivel de Madurez Digital — nos ayudan a entender su contexto y prioridades para personalizar el informe y la conversación de seguimiento.';

        const ACCENT_CLASSES = {
            slate: { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', dot: 'bg-slate-500' },
            rose: { bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', dot: 'bg-rose-500' },
            amber: { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', dot: 'bg-amber-500' },
            sky: { bg: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-200', dot: 'bg-sky-500' },
            teal: { bg: 'bg-teal-50', text: 'text-teal-700', border: 'border-teal-200', dot: 'bg-teal-500' },
            emerald: { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', dot: 'bg-emerald-500' },
            indigo: { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', dot: 'bg-indigo-500' },
            cyan: { bg: 'bg-cyan-50', text: 'text-cyan-700', border: 'border-cyan-200', dot: 'bg-cyan-500' }
        };

        // ===================== MATURITY LOGIC =====================
        const MATURITY_BLOCKS = BLOCKS.filter(b => b.maturity);
        const MATURITY_QUESTION_IDS = MATURITY_BLOCKS.flatMap(b => b.questions.map(q => q.id));

        const normalizeQuestionValue = (question, value) => {
            if (value === undefined || value === null) return null;
            if (question.type === 'single-choice') {
                const n = question.options.length - 1;
                let v = n > 0 ? value / n : 0;
                if (question.invert) v = 1 - v;
                return v;
            }
            if (question.type === 'multi-choice') {
                if (!Array.isArray(value) || value.length === 0) return 0;
                return Math.min(1, value.length / question.options.length);
            }
            if (question.type === 'likert-1-5') return (value - 1) / 4;
            return null;
        };

        const computeMaturity = (responses) => {
            let sum = 0, answered = 0;
            const perQuestion = {};
            MATURITY_BLOCKS.forEach(block => {
                block.questions.forEach(q => {
                    const norm = normalizeQuestionValue(q, responses[q.id]);
                    if (norm !== null) { sum += norm; answered++; perQuestion[q.id] = norm; }
                });
            });
            const score = answered > 0 ? (sum / answered) * 100 : 0;
            let tier = 'Inicial';
            if (score >= 67) tier = 'Avanzado'; else if (score >= 34) tier = 'En Desarrollo';
            return { score, tier, answered, total: MATURITY_QUESTION_IDS.length, perQuestion };
        };

        const generateInsights = (responses) => {
            const insights = [];
            const get = (id) => responses[id];
            if (get('tech1') === 0) insights.push({ type: 'info', title: 'Oportunidad de digitalización', message: 'Migrar de papel/hojas de cálculo a un sistema de gestión (PIMS) es la base para escalar.', priority: 1 });
            if (get('tech1') === 2) insights.push({ type: 'success', title: 'Base tecnológica sólida', message: 'Ya opera con un sistema cloud-based — buena base para sumar automatización.', priority: 3 });
            if (get('doc1') === 3) insights.push({ type: 'info', title: 'Documentación consume mucho tiempo', message: 'Más de 2 horas diarias en historias clínicas es una señal clara de oportunidad de automatización.', priority: 1 });
            if (get('doc2') !== undefined && get('doc2') <= 1) insights.push({ type: 'info', title: 'Documentación manuscrita o mecanografiada', message: 'Un escriba de IA o dictado por voz podría reducir el tiempo administrativo de forma significativa.', priority: 2 });
            if (get('ia1') === 0) insights.push({ type: 'info', title: 'IA aún no adoptada', message: 'El equipo no ha explorado IA generativa — hay margen amplio para empezar con casos de uso simples.', priority: 2 });
            if (get('ia3') === 3) insights.push({ type: 'success', title: 'Equipo entusiasta con IA', message: 'La actitud del equipo es favorable para adoptar herramientas complementarias.', priority: 3 });
            if (Array.isArray(get('mkt2')) && get('mkt2').length <= 1) insights.push({ type: 'info', title: 'Pocos canales digitales activos', message: 'Diversificar canales (WhatsApp Business, Google Business) amplía el alcance sin gran inversión.', priority: 2 });
            if (get('rev1') === 0) insights.push({ type: 'info', title: 'Recordatorios manuales', message: 'Automatizar recordatorios de vacunas y desparasitación reduce ausentismo con poco esfuerzo.', priority: 2 });
            insights.sort((a, b) => a.priority - b.priority);
            return insights;
        };

        const blockProgress = (block, responses) => {
            const total = block.questions.length;
            const answered = block.questions.filter(q => {
                const v = responses[q.id];
                if (q.type === 'multi-choice') return Array.isArray(v) && v.length > 0;
                if (q.type === 'open') return v !== undefined && v !== '';
                return v !== undefined && v !== null;
            }).length;
            return { answered, total };
        };

        // ===================== COMPONENTS =====================

        const Header = ({ currentView, progress, sectionIndex, sectionTitle }) => (
            <header className="bg-vet-900 text-paper-50 sticky top-0 z-50">
                <div className="max-w-5xl mx-auto px-5 py-4">
                    <div className="flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <img src={LOGO_SRC} alt="BioVetAI" style={{height: '70px'}} className="w-auto"/>
                            <div className="hidden sm:block h-8 w-px bg-white/15"></div>
                            <div className="hidden sm:block">
                                <p className="font-display text-base font-semibold leading-tight">VetClinic 360™</p>
                                <p className="text-white/55 text-[11px] tracking-wide uppercase">Diagnóstico de Madurez Digital</p>
                            </div>
                        </div>
                        {currentView === 'survey' && (
                            <p className="text-white/70 text-xs sm:text-sm text-right">
                                Sección {sectionIndex + 1} de {BLOCKS.length}
                                <span className="hidden md:inline"> — {sectionTitle}</span>
                            </p>
                        )}
                    </div>
                    {currentView === 'survey' && (
                        <div className="mt-3 h-[3px] bg-white/15 rounded-full overflow-hidden">
                            <div className="h-full bg-vet-300 progress-fill" style={{ width: `${progress}%` }}></div>
                        </div>
                    )}
                </div>
            </header>
        );

        const IntroScreen = ({ onStart }) => {
            const [clinicName, setClinicName] = useState('');
            const [email, setEmail] = useState('');

            const benefits = [
                'Un Nivel de Madurez Digital único (Inicial / En Desarrollo / Avanzado), calculado con 20 preguntas fácticas sobre su operación',
                'Contexto adicional (perfil, barreras e interés de inversión) para personalizar el informe',
                'Ruta de acción concreta con próximos pasos priorizados',
                'Consulta de 30 minutos, sin costo, para revisar resultados (opcional)'
            ];

            return (
                <div className="max-w-5xl mx-auto px-5 py-12 md:py-16">
                    <div className="grid md:grid-cols-5 gap-10 md:gap-14">
                        <div className="md:col-span-2 animate-fade-in-up">
                            <p className="text-vet-700 text-xs font-semibold tracking-[0.14em] uppercase mb-4" style={{textTransform: 'none', color: '#1F482F', fontSize: '18px', width: '389px', height: '17px'}}>BioVetAI™ — Ecosistema Integrado</p>
                            <h1 className="font-display text-4xl md:text-[2.75rem] leading-[1.08] font-semibold text-vet-950 mb-5">
                                Diagnóstico de Madurez Digital
                            </h1>
                            <p className="text-stone-600 text-lg leading-relaxed mb-8">
                                Un instrumento de autoevaluación de 26 preguntas en 8 bloques: 20 fácticas que calculan su Nivel de Madurez Digital, y 6 de contexto adicional para entender mejor su operación.
                            </p>
                            <div className="flex flex-wrap gap-x-6 gap-y-3 text-sm text-stone-500 border-t border-stone-200 pt-6">
                                <span className="flex items-center gap-2"><Icon name="clock" className="w-4 h-4"/>5–7 minutos</span>
                                <span className="flex items-center gap-2"><Icon name="lock" className="w-4 h-4"/>Confidencial</span>
                                <span className="flex items-center gap-2"><Icon name="gauge" className="w-4 h-4"/>Nivel de Madurez único</span>
                            </div>
                        </div>

                        <div className="md:col-span-3 animate-fade-in-up">
                            <div className="border border-stone-200 rounded-2xl p-6 md:p-8 bg-white mb-6">
                                <h2 className="font-display text-lg font-semibold text-vet-950 mb-5">Al completar este diagnóstico recibe</h2>
                                <ul className="space-y-4">
                                    {benefits.map((b, i) => (
                                        <li key={i} className="flex items-start gap-3">
                                            <span className="mt-0.5 text-vet-600 flex-shrink-0"><Icon name="check" className="w-5 h-5"/></span>
                                            <span className="text-stone-700 leading-snug">{b}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="border border-stone-200 rounded-2xl p-6 md:p-8 bg-white card-hover">
                                <h3 className="font-display text-lg font-semibold text-vet-950 mb-6">Información inicial</h3>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-2">Nombre de la clínica *</label>
                                        <input
                                            type="text"
                                            value={clinicName}
                                            onChange={(e) => setClinicName(e.target.value)}
                                            className="w-full px-4 py-3 border border-stone-300 rounded-lg focus:border-vet-600 focus:outline-none focus:ring-1 focus:ring-vet-600"
                                            placeholder="Ej: Clínica Veterinaria San Francisco"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-stone-700 mb-2">Correo electrónico (opcional)</label>
                                        <input
                                            type="email"
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            className="w-full px-4 py-3 border border-stone-300 rounded-lg focus:border-vet-600 focus:outline-none focus:ring-1 focus:ring-vet-600"
                                            placeholder="Para recibir el reporte"
                                        />
                                    </div>
                                </div>

                                <button
                                    onClick={() => onStart({ clinicName, email })}
                                    disabled={!clinicName}
                                    className={`w-full mt-8 py-3.5 px-6 rounded-lg font-semibold text-base transition-all flex items-center justify-center gap-2 ${
                                        clinicName ? 'bg-vet-800 text-white hover:bg-vet-900' : 'bg-stone-200 text-stone-400 cursor-not-allowed'
                                    }`}
                                >
                                    Comenzar diagnóstico <Icon name="chevronRight" className="w-4 h-4"/>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Likert5Field = ({ value, onChange, questionId, lowLabel, highLabel }) => (
            <div>
                <div className="grid grid-cols-5 gap-2 mt-4">
                    {[1, 2, 3, 4, 5].map((v) => (
                        <button
                            key={v}
                            onClick={() => onChange(questionId, v)}
                            className={`likert-option p-2.5 rounded-lg border text-center ${
                                value === v ? 'bg-vet-800 border-vet-800 text-white' : 'bg-paper-50 border-stone-200 text-stone-600 hover:border-stone-300'
                            }`}
                        >
                            <span className="text-base font-semibold block">{v}</span>
                        </button>
                    ))}
                </div>
                <div className="flex justify-between text-[11px] text-stone-400 mt-1.5">
                    <span>{lowLabel}</span><span>{highLabel}</span>
                </div>
            </div>
        );

        const SingleChoiceField = ({ options, value, onChange, questionId }) => (
            <div className="flex flex-col gap-2 mt-4">
                {options.map((opt, i) => (
                    <button
                        key={i}
                        onClick={() => onChange(questionId, i)}
                        className={`text-left px-4 py-2.5 rounded-lg border text-sm ${
                            value === i ? 'bg-vet-800 border-vet-800 text-white' : 'bg-paper-50 border-stone-200 text-stone-600 hover:border-stone-300'
                        }`}
                    >
                        {opt}
                    </button>
                ))}
            </div>
        );

        const MultiChoiceField = ({ options, value, onChange, questionId }) => {
            const arr = Array.isArray(value) ? value : [];
            const toggle = (i) => onChange(questionId, arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i]);
            return (
                <div className="flex flex-wrap gap-2 mt-4">
                    {options.map((opt, i) => (
                        <button
                            key={i}
                            onClick={() => toggle(i)}
                            className={`px-3.5 py-2 rounded-lg border text-sm ${
                                arr.includes(i) ? 'bg-vet-800 border-vet-800 text-white' : 'bg-paper-50 border-stone-200 text-stone-600 hover:border-stone-300'
                            }`}
                        >
                            {opt}
                        </button>
                    ))}
                </div>
            );
        };

        const QuestionCard = ({ question, index, value, onChange }) => (
            <div className="bg-white rounded-xl border border-stone-200 p-5 card-hover">
                <div className="flex items-start gap-3">
                    <span className="w-7 h-7 bg-vet-50 text-vet-700 rounded-md flex items-center justify-center text-xs font-semibold flex-shrink-0 mt-0.5">
                        {index + 1}
                    </span>
                    <div className="flex-1">
                        <p className="text-stone-800 font-medium leading-snug">{question.text}</p>
                        {question.type === 'single-choice' && (
                            <SingleChoiceField options={question.options} value={value} onChange={onChange} questionId={question.id} />
                        )}
                        {question.type === 'multi-choice' && (
                            <MultiChoiceField options={question.options} value={value} onChange={onChange} questionId={question.id} />
                        )}
                        {question.type === 'likert-1-5' && (
                            <Likert5Field value={value} onChange={onChange} questionId={question.id} lowLabel={question.lowLabel} highLabel={question.highLabel} />
                        )}
                        {question.type === 'open' && (
                            <textarea
                                value={value || ''}
                                onChange={(e) => onChange(question.id, e.target.value)}
                                className="w-full mt-3 px-4 py-3 border border-stone-300 rounded-lg focus:border-vet-600 focus:outline-none focus:ring-1 focus:ring-vet-600 resize-none"
                                rows="3"
                                placeholder="Escriba su respuesta aquí..."
                            />
                        )}
                    </div>
                </div>
            </div>
        );

        const InsightCard = ({ insight }) => {
            const styles = {
                danger: { cls: 'border-red-200 bg-red-50', text: 'text-red-800', icon: 'alert' },
                warning: { cls: 'border-amber-200 bg-amber-50', text: 'text-amber-800', icon: 'alert' },
                info: { cls: 'border-sky-200 bg-sky-50', text: 'text-sky-800', icon: 'info' },
                success: { cls: 'border-vet-200 bg-vet-50', text: 'text-vet-800', icon: 'checkBadge' }
            };
            const s = styles[insight.type];
            return (
                <div className={`p-4 rounded-xl border flex items-start gap-3 ${s.cls}`}>
                    <span className={`flex-shrink-0 mt-0.5 ${s.text}`}><Icon name={s.icon} className="w-5 h-5"/></span>
                    <div>
                        <h4 className={`font-semibold mb-0.5 ${s.text}`}>{insight.title}</h4>
                        <p className={`text-sm opacity-90 ${s.text}`}>{insight.message}</p>
                    </div>
                </div>
            );
        };

        const SectionRail = ({ currentSection, onSelect, responses }) => {
            const groups = [
                { key: 'profile', label: 'PERFIL · metadata', blocks: BLOCKS.filter(b => b.id === 'profile') },
                { key: 'maturity', label: 'MADUREZ · con puntaje', blocks: BLOCKS.filter(b => b.maturity) },
                { key: 'qualification', label: 'CALIFICACIÓN · sin puntaje', blocks: BLOCKS.filter(b => !b.maturity && b.id !== 'profile') }
            ];
            return (
                <div className="mb-6 space-y-3">
                    {groups.map((g) => (
                        <div key={g.key}>
                            <p className={`text-[10px] font-semibold tracking-wide uppercase mb-1.5 ${g.key === 'maturity' ? 'text-vet-600' : 'text-stone-400'}`}>{g.label}</p>
                            <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                                {g.blocks.map((b) => {
                                    const idx = BLOCKS.indexOf(b);
                                    const progress = blockProgress(b, responses);
                                    const done = progress.answered === progress.total;
                                    const active = idx === currentSection;
                                    return (
                                        <button
                                            key={b.id}
                                            onClick={() => onSelect(idx)}
                                            title={b.title}
                                            className={`rail-chip flex-shrink-0 w-9 h-9 rounded-full border flex items-center justify-center text-xs font-semibold ${
                                                active ? (g.key === 'maturity' ? 'bg-vet-800 border-vet-800 text-white' : 'bg-stone-700 border-stone-700 text-white') :
                                                done ? (g.key === 'maturity' ? 'bg-vet-50 border-vet-200 text-vet-700' : 'bg-stone-100 border-stone-200 text-stone-600') :
                                                'bg-white border-stone-200 text-stone-400'
                                            }`}
                                        >
                                            {done && !active ? <Icon name="check" className="w-4 h-4"/> : idx + 1}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const SurveyScreen = ({ clinicInfo, responses, setResponses, onComplete, currentSection, setCurrentSection }) => {
            const block = BLOCKS[currentSection];
            const accent = ACCENT_CLASSES[block.accent];
            const isMaturity = block.maturity;
            const isProfile = block.id === 'profile';

            const handleChange = (questionId, value) => {
                setResponses(prev => ({ ...prev, [questionId]: value }));
            };

            const insights = useMemo(() => generateInsights(responses), [responses]);

            const goTo = (idx) => { setCurrentSection(idx); window.scrollTo({ top: 0, behavior: 'smooth' }); };

            return (
                <div className="max-w-3xl mx-auto px-5 py-8">
                    <SectionRail currentSection={currentSection} onSelect={goTo} responses={responses} />

                    <div className="flex items-start gap-4 mb-4 pb-6 border-b border-stone-200">
                        <span className={`w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ${accent.bg} ${accent.text} border ${accent.border}`}>
                            <Icon name={block.icon} className="w-6 h-6"/>
                        </span>
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <p className={`text-xs font-semibold tracking-wide uppercase ${accent.text}`}>Sección {currentSection + 1} de {BLOCKS.length}</p>
                                {!isProfile && (
                                    <span className={`text-[10px] font-semibold tracking-wide uppercase px-2 py-0.5 rounded-full ${isMaturity ? 'bg-vet-100 text-vet-700' : 'bg-stone-100 text-stone-500'}`}>
                                        {isMaturity ? 'Madurez · con puntaje' : 'Calificación · sin puntaje'}
                                    </span>
                                )}
                            </div>
                            <h2 className="font-display text-2xl font-semibold text-vet-950">{block.title}</h2>
                            <p className="mt-1.5 text-stone-500 text-sm leading-relaxed">{block.description}</p>
                        </div>
                    </div>

                    {!isMaturity && !isProfile && (
                        <div className="rounded-xl border border-stone-200 bg-stone-50 p-4 mb-6 flex items-start gap-3">
                            <span className="text-stone-500 flex-shrink-0 mt-0.5"><Icon name="info" className="w-5 h-5"/></span>
                            <p className="text-sm text-stone-600 leading-relaxed">{QUALIFICATION_DISCLAIMER}</p>
                        </div>
                    )}

                    <div className="space-y-4 mb-8">
                        {block.questions.map((question, idx) => (
                            <QuestionCard key={question.id} question={question} index={idx} value={responses[question.id]} onChange={handleChange} />
                        ))}
                    </div>

                    <div className="flex justify-between gap-4">
                        <button
                            onClick={() => goTo(currentSection - 1)}
                            disabled={currentSection === 0}
                            className={`px-5 py-3 rounded-lg font-medium flex items-center gap-1.5 ${currentSection === 0 ? 'bg-stone-100 text-stone-300' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}
                        >
                            <Icon name="chevronLeft" className="w-4 h-4"/> Anterior
                        </button>

                        {currentSection === BLOCKS.length - 1 ? (
                            <button onClick={onComplete} className="px-6 py-3 bg-vet-800 text-white rounded-lg font-semibold hover:bg-vet-900 flex items-center gap-2">
                                Ver resultados <Icon name="gauge" className="w-4 h-4"/>
                            </button>
                        ) : (
                            <button
                                onClick={() => goTo(currentSection + 1)}
                                className="px-6 py-3 bg-vet-800 text-white rounded-lg font-medium hover:bg-vet-900 flex items-center gap-1.5"
                            >
                                Siguiente <Icon name="chevronRight" className="w-4 h-4"/>
                            </button>
                        )}
                    </div>

                    {isMaturity && insights.length > 0 && (
                        <div className="mt-10 pt-8 border-t border-stone-200">
                            <h3 className="font-display text-lg font-semibold text-vet-950 mb-4">Análisis en vivo</h3>
                            <div className="space-y-3">
                                {insights.slice(0, 3).map((insight, idx) => (
                                    <InsightCard key={idx} insight={insight} />
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MaturityGauge = ({ score, tier }) => {
            const tone = tier === 'Avanzado'
                ? { text: 'text-vet-700', bg: 'bg-vet-50', border: 'border-vet-200' }
                : tier === 'En Desarrollo'
                ? { text: 'text-amber-700', bg: 'bg-amber-50', border: 'border-amber-200' }
                : { text: 'text-stone-600', bg: 'bg-stone-50', border: 'border-stone-200' };
            const pct = Math.min(100, Math.max(0, score));
            return (
                <div className={`rounded-2xl border ${tone.border} ${tone.bg} p-8 text-center`}>
                    <span className={`font-display text-5xl font-semibold ${tone.text}`}>{Math.round(score)}<span className="text-2xl">/100</span></span>
                    <p className={`mt-2 font-medium ${tone.text}`}>{tier}</p>
                    <p className="text-stone-500 text-sm mt-1">Nivel de Madurez Digital</p>
                    <div className="relative mt-7">
                        <div className="h-3 rounded-full overflow-hidden flex">
                            <div className="flex-1 bg-stone-300"></div>
                            <div className="flex-1 bg-amber-300"></div>
                            <div className="flex-1 bg-vet-400"></div>
                        </div>
                        <div className="absolute -top-[7px] w-4 h-4 rounded-full bg-vet-950 border-2 border-white shadow" style={{ left: `calc(${pct}% - 8px)` }}></div>
                    </div>
                    <div className="flex justify-between text-[10px] text-stone-400 mt-2 uppercase tracking-wide">
                        <span>Inicial</span><span>En Desarrollo</span><span>Avanzado</span>
                    </div>
                </div>
            );
        };

        const QualificationSummary = ({ responses }) => {
            const block = BLOCKS.find(b => b.id === 'barriers_investment');
            const profileBlock = BLOCKS.find(b => b.id === 'profile');
            const renderValue = (q) => {
                const v = responses[q.id];
                if (q.type === 'single-choice') return v !== undefined ? q.options[v] : 'Sin responder';
                if (q.type === 'multi-choice') return Array.isArray(v) && v.length ? v.map(i => q.options[i]).join(', ') : 'Sin responder';
                if (q.type === 'likert-1-5') return v !== undefined ? `${v}/5` : 'Sin responder';
                return v || 'Sin responder';
            };
            return (
                <div className="mb-10">
                    <h3 className="font-display text-xl font-semibold text-vet-950 mb-3">Perfil y calificación</h3>
                    <div className="rounded-xl border border-stone-200 bg-stone-50 p-4 mb-5 flex items-start gap-3">
                        <span className="text-stone-500 flex-shrink-0 mt-0.5"><Icon name="info" className="w-5 h-5"/></span>
                        <p className="text-sm text-stone-600 leading-relaxed">{QUALIFICATION_DISCLAIMER}</p>
                    </div>
                    <div className="space-y-4">
                        <div className="rounded-xl border border-stone-200 bg-white p-5">
                            <h4 className="font-display text-base font-semibold text-vet-950 mb-3">{profileBlock.title}</h4>
                            <div className="space-y-3">
                                {profileBlock.questions.map(q => (
                                    <div key={q.id} className="pb-3 border-b border-stone-100 last:border-0 last:pb-0">
                                        <p className="text-sm text-stone-500 mb-1">{q.text}</p>
                                        <p className="text-stone-800 font-medium">{renderValue(q)}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="rounded-xl border border-stone-200 bg-white p-5">
                            <h4 className="font-display text-base font-semibold text-vet-950 mb-3">{block.title}</h4>
                            <div className="space-y-3">
                                {block.questions.map(q => (
                                    <div key={q.id} className="pb-3 border-b border-stone-100 last:border-0 last:pb-0">
                                        <p className="text-sm text-stone-500 mb-1">{q.text}</p>
                                        <p className="text-stone-800 font-medium">{renderValue(q)}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ResultsScreen = ({ clinicInfo, responses, onRestart, clinicId }) => {
            const [leadEmail, setLeadEmail] = useState('');
            const [leadSent, setLeadSent] = useState(false);

            const { score, tier } = useMemo(() => computeMaturity(responses), [responses]);
            const insights = useMemo(() => generateInsights(responses), [responses]);

            const interpretation = {
                'Inicial': `Su clínica usa ${Math.round(score * MATURITY_QUESTION_IDS.length / 100)} de ${MATURITY_QUESTION_IDS.length} prácticas digitales evaluadas — hay una oportunidad clara de empezar por lo básico.`,
                'En Desarrollo': `Su clínica usa ${Math.round(score * MATURITY_QUESTION_IDS.length / 100)} de ${MATURITY_QUESTION_IDS.length} prácticas digitales evaluadas — ya tiene bases sólidas, con margen concreto para avanzar.`,
                'Avanzado': `Su clínica usa ${Math.round(score * MATURITY_QUESTION_IDS.length / 100)} de ${MATURITY_QUESTION_IDS.length} prácticas digitales evaluadas — está por delante de la mayoría, con oportunidad de optimizar y escalar.`
            }[tier];

            const handleLeadSubmit = (e) => {
                e.preventDefault();
                if (!leadEmail) return;
                sendToFormspree({ _subject: "Lead Magnet: " + clinicInfo.clinicName, tipo: "LEAD_MAGNET", clinica: clinicInfo.clinicName, email: leadEmail });
                updateClinicEmail(clinicId, leadEmail);
                setLeadSent(true);
            };

            return (
                <div className="max-w-3xl mx-auto px-5 py-10">
                    <div className="mb-8">
                        <p className="text-vet-700 text-xs font-semibold tracking-[0.14em] uppercase mb-2">Resultados del diagnóstico</p>
                        <h2 className="font-display text-3xl font-semibold text-vet-950">{clinicInfo.clinicName}</h2>
                    </div>

                    <div className="mb-6">
                        <MaturityGauge score={score} tier={tier} />
                    </div>
                    <p className="text-stone-600 leading-relaxed mb-10">{interpretation}</p>

                    {insights.length > 0 && (
                        <div className="mb-10">
                            <h3 className="font-display text-xl font-semibold text-vet-950 mb-5">Recomendaciones</h3>
                            <div className="space-y-3">
                                {insights.map((insight, idx) => (
                                    <InsightCard key={idx} insight={insight} />
                                ))}
                            </div>
                        </div>
                    )}

                    <QualificationSummary responses={responses} />

                    <div className="bg-vet-900 rounded-2xl p-8 mb-8 text-white text-center">
                        <h3 className="font-display text-2xl font-semibold mb-3">
                            Convierta este diagnóstico en un plan de acción
                        </h3>
                        <p className="text-white/70 mb-6 max-w-lg mx-auto">
                            Sesión 1-a-1 con el Prof. Luis Maroto, DVM, PhD, para priorizar sus próximos pasos. 45 minutos — USD 97.
                        </p>
                        <a
                            href="https://meetings-na2.hubspot.com/luis-o"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-2 px-7 py-3.5 bg-white text-vet-900 rounded-lg font-semibold hover:bg-vet-50"
                        >
                            <Icon name="calendar" className="w-4 h-4"/> Agendar consulta
                        </a>
                    </div>

                    <div className="rounded-2xl border border-stone-200 bg-white p-6 mb-8">
                        {leadSent ? (
                            <div className="text-center py-4">
                                <span className="text-vet-700 inline-block mb-2"><Icon name="checkBadge" className="w-8 h-8"/></span>
                                <p className="text-vet-700 font-semibold">Enviado — revise su correo en breve.</p>
                            </div>
                        ) : (
                            <div className="text-center">
                                <p className="text-stone-600 mb-4">¿Prefiere seguir explorando antes de agendar? Reciba una guía gratuita.</p>
                                <form onSubmit={handleLeadSubmit} className="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
                                    <input
                                        type="email"
                                        value={leadEmail}
                                        onChange={(e) => setLeadEmail(e.target.value)}
                                        placeholder="Su correo"
                                        required
                                        className="flex-1 px-4 py-3 border border-stone-300 rounded-lg focus:border-vet-600 focus:outline-none focus:ring-1 focus:ring-vet-600"
                                    />
                                    <button type="submit" className="px-6 py-3 bg-vet-900 text-white rounded-lg font-medium hover:bg-vet-800 flex items-center justify-center gap-2">
                                        <Icon name="mail" className="w-4 h-4"/> Enviar
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>

                    <div className="text-center">
                        <button onClick={onRestart} className="px-5 py-2.5 text-stone-500 font-medium hover:text-stone-700 inline-flex items-center gap-2">
                            <Icon name="refresh" className="w-4 h-4"/> Nuevo diagnóstico
                        </button>
                    </div>
                </div>
            );
        };

        // ===================== APP =====================
        const App = () => {
            const [currentView, setCurrentView] = useState('intro');
            const [clinicInfo, setClinicInfo] = useState(null);
            const [savedClinicId, setSavedClinicId] = useState(null);
            const [responses, setResponses] = useState({});
            const [currentSectionIdx, setCurrentSectionIdx] = useState(0);

            const totalQuestions = BLOCKS.reduce((acc, b) => acc + b.questions.length, 0);
            const progress = (Object.keys(responses).length / totalQuestions) * 100;

            const handleStart = (info) => {
                setClinicInfo(info);
                setCurrentView('survey');
            };

            const handleComplete = () => {
                const { score, tier } = computeMaturity(responses);

                sendToFormspree({
                    _subject: "Diagnóstico VetClinic 360: " + clinicInfo.clinicName + " (" + tier + ", " + Math.round(score) + "/100)",
                    tipo: "ENCUESTA",
                    fecha: new Date().toLocaleString('es-ES'),
                    clinica: clinicInfo.clinicName,
                    email: clinicInfo.email || "No proporcionado",
                    nivel_madurez: tier,
                    puntaje_madurez: Math.round(score),
                    respuestas: JSON.stringify(responses)
                });
                saveToSupabase(clinicInfo, responses, score, tier, 'completed').then(id => setSavedClinicId(id));

                setCurrentView('results');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleRestart = () => {
                setClinicInfo(null);
                setResponses({});
                setCurrentSectionIdx(0);
                setSavedClinicId(null);
                setCurrentView('intro');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Header currentView={currentView} progress={progress} sectionIndex={currentSectionIdx} sectionTitle={BLOCKS[currentSectionIdx] && BLOCKS[currentSectionIdx].title} />
                    <main className="flex-1">
                        {currentView === 'intro' && <IntroScreen onStart={handleStart} />}
                        {currentView === 'survey' && clinicInfo && (
                            <SurveyScreen clinicInfo={clinicInfo} responses={responses} setResponses={setResponses} onComplete={handleComplete} currentSection={currentSectionIdx} setCurrentSection={setCurrentSectionIdx} />
                        )}
                        {currentView === 'results' && clinicInfo && (
                            <ResultsScreen clinicInfo={clinicInfo} responses={responses} onRestart={handleRestart} clinicId={savedClinicId} />
                        )}
                    </main>
                    <footer className="bg-vet-950 text-white/50 py-8">
                        <div className="max-w-3xl mx-auto px-5 text-center text-sm">
                            <p>© {new Date().getFullYear()} powered by BioVetAI™ — <a href="mailto:lmarotomar@biovetai.org" className="text-vet-300 hover:text-vet-200 hover:underline">lmarotomar@biovetai.org</a></p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        (function () {
            const src = document.getElementById('app-source').textContent;
            const out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
            const tag = document.createElement('script');
            tag.textContent = out;
            document.body.appendChild(tag);
        })();
    </script>
</body>
</html>
